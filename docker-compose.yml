version: "3.8"

services:
  bitcoin:
    image: bitcoin/bitcoin:latest
    container_name: btc_regtest
    ports:
      - "18443:18443"   # RPC port for regtest
      - "18444:18444"   # P2P port
    command:
      - -regtest
      - -server
      - -rpcuser=ironsign
      - -rpcpassword=ironsign123
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -fallbackfee=0.00001
      - -txindex=1
    volumes:
      - btc_data:/home/bitcoin/.bitcoin

volumes:
  btc_data: